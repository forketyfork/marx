name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Nix store
      uses: cachix/cachix-action@v16
      with:
        name: forketyfork
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Check formatting with black
      run: nix develop --accept-flake-config --command black --check marx tests

    - name: Lint with ruff
      run: nix develop --accept-flake-config --command ruff check marx tests

    - name: Type check with mypy
      run: nix develop --accept-flake-config --command mypy marx

    - name: Run tests with pytest
      run: nix develop --accept-flake-config --command pytest -v
